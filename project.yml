name: Thesis
options:
  bundleIdPrefix: com.thesis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Thesis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Thesis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thesis.onboarding
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_ON_DEMAND_RESOURCES: "NO"
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETSCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Thesis
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: "YES"
  ThesisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ThesisTests
    dependencies:
      - target: Thesis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Thesis:
    build:
      targets:
        Thesis: all
        ThesisTests: [test]
    test:
      targets:
        - ThesisTests
    run:
      config: Debug
